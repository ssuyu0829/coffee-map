<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Coffee Map — 台灣咖啡地圖</title>
  <link rel="stylesheet" href="/static/css/style.css">
</head>
<body>

  <nav class="navbar">
    <span class="logo">☕</span>
    <h1>Coffee Map</h1>
    <span>台灣咖啡廳探索地圖</span>
  </nav>

  <div class="layout">
    <aside class="sidebar">

      <!-- ── 第一層：搜尋方式 ── -->
      <div class="section-label">搜尋方式</div>

      <div class="search-tabs">
        <button class="tab-btn active" id="tab-area"     onclick="switchTab('area')">🗺 選擇區域</button>
        <button class="tab-btn"        id="tab-location" onclick="switchTab('location')">📍 目前位置</button>
      </div>

      <!-- 區域選擇 -->
      <div id="panel-area">
        <div class="field">
          <label for="city-select">縣市</label>
          <select id="city-select" onchange="onCityChange()">
            <option value="">— 選擇縣市 —</option>
          </select>
        </div>
        <div class="field">
          <label for="district-select">行政區</label>
          <select id="district-select" disabled>
            <option value="">— 請先選擇縣市 —</option>
          </select>
        </div>
      </div>

      <!-- 目前位置 -->
      <div id="panel-location" style="display:none">
        <p class="location-hint">點下方按鈕，自動搜尋你附近 1.5 公里內的咖啡廳</p>
      </div>

      <!-- ── 分隔線 ── -->
      <hr class="section-divider">

      <!-- ── 第二層：篩選條件 ── -->
      <div class="section-label">篩選條件</div>

      <div class="filter-row">
        <div class="field">
          <label for="sort-select">排序</label>
          <select id="sort-select">
            <option value="default">預設</option>
            <option value="rating_desc">⭐ 評分高→低</option>
            <option value="rating_asc">⭐ 評分低→高</option>
            <option value="distance">📍 距離近→遠</option>
          </select>
        </div>
        <div class="field">
          <label class="toggle-label">
            <input type="checkbox" id="open-now-toggle">
            <span>僅顯示營業中</span>
          </label>
        </div>
      </div>

      <div class="field">
        <label>標籤（可複選，需全部符合）</label>
        <div class="tag-filters" id="tag-filters"></div>
      </div>

      <!-- ── 搜尋按鈕 ── -->
      <button class="search-btn" id="search-btn" onclick="doSearch()">搜尋咖啡廳</button>

      <p class="result-count" id="result-count"></p>

    </aside>

    <main class="main" id="main-content">
      <div class="state-msg">
        <div class="icon">🗺</div>
        <p>選擇區域或使用目前位置，開始探索咖啡廳</p>
      </div>
    </main>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal" id="modal"></div>
  </div>

  <script src="/static/js/app.js"></script>
</body>
</html>
