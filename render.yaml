services:
  - type: web
    name: coffee-map
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: GOOGLE_MAPS_API_KEY
        sync: false
      - key: FLASK_ENV
        value: production
      - key: FLASK_PORT
        value: "10000"
